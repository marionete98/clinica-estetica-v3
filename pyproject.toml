[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinica-luana-ai"
version = "2.0.0"
description = "AI-powered multi-agent customer service system for Clínica Luana"
requires-python = ">=3.13"
authors = [
    {name = "Clínica Luana Carla", email = "contato@luanacarladermoclinic.com"},
]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true